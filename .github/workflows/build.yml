# ─────────────────────────────────────────────────────────────────────────────
# Tally 塔莉 · PR 门禁与「这个仓库真的能构建」的证明
#
# 这个 workflow **不发布任何东西**：不出 Release、不签正式包、不打 tag、不上传
# 到任何应用商店。它跑两个**并行**的 job：
#   1. 单元测试 —— `:tally-app:testDebugUnitTest`，纯 JVM（备份编解码契约、加密
#      容器、分期排期与口径、账单编辑策略），不碰 Android framework；
#   2. 构建 apk —— `:tally-app:build`，在干净的 Linux runner 上零配置跑全量：
#      lint + 单测 + debug/release 两个变体打包。它同时证明「编得出来」和「lint 干净」，
#      发布前那条本地门槛在 CI 上也有了一份。artifact 只挂 release APK（用户实际装的那份）。
#
# 触发：
#   - PR 到 `master` → 两个 job 都跑，检查挂在 PR 上（门禁）；
#   - push 到 `master` → 合并后再确认一次；
#   - push 到公开仓 `main` → 发布提交落地的确认；
#   - workflow_dispatch → 手动指定 ref 跑一次。
# PR 目标分支与 push 分支都收在 master，开发分支的 push 不重复触发。
#
# ── 【为什么零配置就能跑通】 ──────────────────────────────────────────────
#   仓库自带一把测试签名钥匙 `tally-app/keystore/tally-unified.jks`
#   （store/key 口令都是 `android`，别名 `androiddebugkey`），
#   `tally-app/build.gradle.kts` 的 `signingConfigs` 默认值就是它；
#   `local.properties` 不进 git，CI 上不存在，走默认值。**不需要任何 secret**。
#
# ── 【SDK 包 id】 ──────────────────────────────────────────────────────────
#   `platforms;android-37.0`（AGP 解析 compileSdk=37 + minor=0 的结果）、
#   `build-tools;36.0.0`、`platform-tools`。API 37 已是正式版，不需要 `--channel=`。
#   不用 android-actions/setup-android@v3：它会去装早已下架的 `tools` 包，
#   在 runner 自带的 cmdline-tools 16 上直接报 "Failed to find package 'tools'" 并退出 1。
#
# ── 【Gradle 发行包】 ─────────────────────────────────────────────────────
#   wrapper 默认指腾讯镜像（照顾国内网络），GitHub runner 在国外，先 sed 回官方源。
# ─────────────────────────────────────────────────────────────────────────────

name: build

on:
  push:
    # master 是本仓集成基线。main 是公开仓的默认分支——同一份 workflow 会随白名单
    # 同步过去，发布提交落 main 时也该验一次，所以两个都列。
    branches:
      - master
      - main
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

# 只读：不写仓库、不发 Release、不碰任何 secret。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 21（Temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 准备环境（SDK + Gradle 源）
        run: bash .github/scripts/ci-env.sh

      # 换源之后再让 setup-gradle 接手：它读的就是 wrapper properties，
      # 顺序反了会照着腾讯镜像去预热缓存。Gradle 发行包与依赖按 job 各缓存一份。
      - name: Gradle 依赖缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 纯 JVM 单元测试
        run: ./gradlew :tally-app:testDebugUnitTest --stacktrace

      - name: 上传测试报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ github.event_name }}-${{ github.run_id }}
          path: tally-app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

  assemble-apk:
    name: 构建 apk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 21（Temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 准备环境（SDK + Gradle 源）
        run: bash .github/scripts/ci-env.sh

      # 换源之后再让 setup-gradle 接手：它读的就是 wrapper properties，
      # 顺序反了会照着腾讯镜像去预热缓存。Gradle 发行包与依赖按 job 各缓存一份。
      - name: Gradle 依赖缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 全量构建（lint + 单测 + APK）
        run: ./gradlew :tally-app:build --stacktrace

      - name: 上传 release APK
        uses: actions/upload-artifact@v4
        with:
          name: tally-app-release-apk
          path: tally-app/build/outputs/apk/release/tally-app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: 把 release APK 的 sha256 写进日志
        run: sha256sum tally-app/build/outputs/apk/release/tally-app-release.apk
